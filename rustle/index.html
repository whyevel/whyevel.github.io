.scrim{position:fixed; inset:0; z-index:1;
  background:
    radial-gradient(90% 60% at 50% 46%, rgba(30,42,26,.55), rgba(30,42,26,.20) 60%, transparent 78%),
    linear-gradient(180deg, rgba(44,58,38,.28) 0%, rgba(44,58,38,.30) 45%, rgba(44,58,38,.55) 100%);}
.leaves{position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden}
.leaf{position:absolute; top:-8vh; font-size:22px; opacity:.5; will-change:transform;
  animation:fall linear infinite; filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.leaf:nth-child(1){left:12%; animation-duration:14s; animation-delay:-2s; font-size:18px}
.leaf:nth-child(2){left:34%; animation-duration:18s; animation-delay:-8s; font-size:26px}
.leaf:nth-child(3){left:58%; animation-duration:15s; animation-delay:-5s; font-size:16px}
.leaf:nth-child(4){left:78%; animation-duration:20s; animation-delay:-11s; font-size:24px}
.leaf:nth-child(5){left:90%; animation-duration:15s; animation-delay:-3s; font-size:15px}
@keyframes fall{
  0%{transform:translateY(-10vh) translateX(0) rotate(0)}
  50%{transform:translateY(52vh) translateX(-26px) rotate(180deg)}
  100%{transform:translateY(115vh) translateX(14px) rotate(360deg)}}
.wrap{position:relative; z-index:3; min-height:100dvh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  padding:calc(env(safe-area-inset-top) + 30px) 22px calc(env(safe-area-inset-bottom) + 26px);}
.icon{width:min(150px,34vw); height:auto; aspect-ratio:1; border-radius:24%; display:block;
  box-shadow:0 14px 34px rgba(0,0,0,.42), inset 0 0 0 1px rgba(255,255,255,.14);}
.title{font-family:"Poppins",sans-serif; font-weight:700; color:#FFFDF4;
  font-size:clamp(2.9rem,16vw,4rem); line-height:1; letter-spacing:.5px;
  margin:22px 0 0; text-shadow:0 2px 0 rgba(44,58,38,.30), 0 10px 26px rgba(0,0,0,.45);
  text-wrap:balance;}
.tagline{font-family:"Poppins",sans-serif; font-weight:500; color:#F1ECD6;
  font-size:clamp(1rem,4.2vw,1.18rem); line-height:1.5; margin:16px auto 0; max-width:24rem;
  text-shadow:0 2px 10px rgba(0,0,0,.55);}
.meta{margin:16px 0 0; display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap;
  font-weight:600; font-size:.68rem; letter-spacing:.5px; text-transform:uppercase; color:#EDE7CE;}
.chip{padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.22); backdrop-filter:blur(4px)}
.badges{margin-top:30px; display:flex; flex-direction:column; align-items:center; gap:14px; width:100%;}
.badge-link{display:inline-flex; transition:transform .12s ease; border-radius:12px}
.badge-link:hover{transform:translateY(-2px)}
.badge-link:active{transform:translateY(0)}
.badge-link:focus-visible{outline:3px solid #FFE08A; outline-offset:4px}
.badge-img{width:min(84vw,300px); height:auto; display:block; filter:drop-shadow(0 8px 20px rgba(0,0,0,.34));}
/* RuStore placeholder (заменим на официальный PNG) */
.rustore{display:flex; align-items:center; gap:12px; height:58px; padding:0 22px;
  background:#000; border:1px solid rgba(255,255,255,.16); border-radius:11px;
  box-shadow:0 8px 20px rgba(0,0,0,.34); color:#fff; text-decoration:none;}
.rustore .txt{display:flex; flex-direction:column; align-items:flex-start; line-height:1.05}
.rustore .small{font-weight:500; font-size:.6rem; letter-spacing:1px; text-transform:uppercase; color:#c9cdd3; margin-bottom:2px}
.rustore .big{font-weight:700; font-size:1.24rem; letter-spacing:.2px}
.hint{margin-top:24px; font-weight:600; font-size:.82rem; color:rgba(240,234,208,.8);
  text-shadow:0 1px 6px rgba(0,0,0,.5)}
.preview-tag{position:fixed; z-index:5; top:10px; left:50%; transform:translateX(-50%);
  font-weight:700; font-size:.6rem; letter-spacing:.8px; text-transform:uppercase; color:#3a2b12;
  background:#FFD874; padding:5px 12px; border-radius:999px; box-shadow:0 4px 12px rgba(0,0,0,.3); text-align:center}
@media (prefers-reduced-motion:reduce){ .leaf{display:none} }
</style>
